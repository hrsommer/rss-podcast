# Einstellungen für den RSS-Podcast.
# Diese Datei kannst du direkt auf GitHub bearbeiten. Änderungen gelten ab dem nächsten Lauf.
#
# Feeds: unten bei "feeds" je zwei Zeilen (name und url). Optional pro Feed:
#   fetch_full_text: false   -> für diesen Feed nie versuchen, den ganzen Artikel nachzuladen

podcast:
  title: "Holger’s Daily Tech Briefing"
  author: Holger
  description: "A private daily briefing on technology and science, generated from my favorite feeds."
  max_minutes: 30            # Obergrenze pro Folge. Bei wenig Inhalt wird die Folge kürzer.
  depth: 2                   # Tiefe von 1 bis 5: 1 = reine Schlagzeilen, 2 = Schlagzeilen mit kurzer
                             # Einordnung, 3 = ausgewogen, 4 = vertiefend, 5 = Analyse weniger Themen
  keep_episodes: 10          # So viele Folgen bleiben im Feed, ältere werden gelöscht

collection:
  lookback_hours: 24         # Nur beim allerersten Lauf: so weit zurück wird gesammelt.
                             # Danach gilt automatisch: alles seit der letzten Folge.
  max_lookback_hours: 80     # Höchstens so weit zurück, z. B. nach dem Urlaub (80 = übers Wochenende)
  max_articles_per_feed: 25  # Mehr Artikel pro Feed werden ignoriert
  fetch_full_text: true      # Bei Anrisstexten den ganzen Artikel von der Webseite holen
  teaser_threshold_chars: 1200   # Feed-Texte unter dieser Länge gelten als Anrisstext
  max_chars_per_article: 12000   # Sehr lange Artikel werden hier abgeschnitten
  min_chars: 150             # Einträge mit weniger Text (z. B. nur eine Überschrift) werden übersprungen
  exclude_title_patterns:    # Artikel, deren Titel einen dieser Texte enthält, werden gar nicht erst
    - "Poem:"                # eingesammelt. Groß- und Kleinschreibung spielt keine Rolle.
    - "crossword"
    - "Math Puzzle"
    - "Readers respond"

limits:
  max_input_chars: 300000    # Harte Obergrenze für alles, was an Claude geht (etwa 75.000 Tokens)
  max_output_tokens: 20000   # Harte Obergrenze für Claudes Antwort
  max_cost_per_run_usd: 0.50 # Lauf wird abgebrochen, wenn die Schätzung darüber liegt
  monthly_budget_usd: 15.0   # Höchstens so viel pro Kalendermonat für Claude
  max_runs_per_day: 3        # Höchstens so viele Läufe pro Tag, die Claude aufrufen

memory:
  days: 14                   # So lange merkt sich der Podcast, welche Themen schon vorkamen

voice:
  engine: kokoro             # Welches System vorliest. Später z. B. auch "openai"
  name: af_heart             # Kokoro-Stimme (af_heart = amerikanisch, weiblich)
  language: en-us
  speed: 1.0                 # 1.1 = etwas schneller, 0.9 = etwas langsamer
  pause_between_paragraphs: 0.6   # Sekunden Pause zwischen zwei Absätzen

model:
  name: claude-sonnet-5-5
  price_input_per_mtok_usd: 2.0    # nur für die Kostenschätzung im Protokoll
  price_output_per_mtok_usd: 10.0

feeds:
  - name: IEEE Spectrum
    url: https://spectrum.ieee.org/feeds/type/news.rss
  - name: Scientific American
    url: https://www.scientificamerican.com/platform/syndication/rss
  - name: Photonics Spectra
    url: https://www.photonics.com/RSS.aspx
    fetch_full_text: false   # Seite verweigert das Nachladen (Status 403), Anrisstexte reichen
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed
  - name: Hackaday
    url: https://hackaday.com/blog/feed/
  - name: Semiconductor Engineering
    url: https://semiengineering.com/feed
