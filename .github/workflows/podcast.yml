name: "Podcast: Folge erstellen"

# Startet automatisch am Vorabend: Sonntag bis Donnerstag um 21:17 UTC
# (= 22:17 Uhr deutscher Winterzeit, 23:17 Uhr Sommerzeit). GitHub startet geplante Läufe
# manchmal stundenlang verspätet, so ist die Folge trotzdem vor dem Morgen fertig.
# Von Hand startbar: Actions -> "Podcast: Folge erstellen" -> "Run workflow".
on:
  schedule:
    - cron: "17 21 * * 0-4"
  workflow_dispatch:
    inputs:
      audio:
        description: "Audio erzeugen und veröffentlichen (ausschalten für einen schnellen Test nur mit Skript)"
        type: boolean
        default: true

permissions:
  contents: write   # nötig, um die Folgen auf den Branch gh-pages zu schreiben

concurrency:
  group: podcast    # nie zwei Läufe gleichzeitig
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Bisherige Folgen holen (beim allerersten Lauf rot, das ist normal)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg und Pakete installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Artikel sammeln, Skript schreiben, vorlesen, veröffentlichen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.audio }}" = "false" ]; then
            python main.py --nur-skript
          else
            python main.py --veroeffentlichen
          fi

      - name: Ergebnis zum Herunterladen bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ergebnis
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Auf GitHub Pages hochladen
        if: always()   # auch nach Fehlern, damit die Kostenliste (costs.json) erhalten bleibt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f site/feed.xml ]; then echo "Noch nichts zu veröffentlichen."; exit 0; fi
          rm -rf site/.git
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Folge vom $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Hochgeladen. Feed: https://hrsommer.github.io/rss-podcast/feed.xml"
