name: "Podcast: Folge erstellen"

# Vorerst nur von Hand startbar: Actions -> "Podcast: Folge erstellen" -> "Run workflow".
# Der automatische Zeitplan kommt in Schritt 6.
on:
  workflow_dispatch:
    inputs:
      audio:
        description: "Audio erzeugen (ausschalten für einen schnellen Test nur mit Skript)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg und Pakete installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Artikel sammeln, Skript schreiben, vorlesen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.audio }}" = "false" ]; then
            python main.py --nur-skript
          else
            python main.py
          fi

      - name: Ergebnis zum Herunterladen bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ergebnis
          path: out/
          if-no-files-found: ignore
          retention-days: 14
